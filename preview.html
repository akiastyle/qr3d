<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f4" />
    <title>qr3d preview</title>
    <base href="/qr3d/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./core/vendor/qrcode.js"></script>
    <script type="module" src="./preview.js"></script>
  </head>
  <body>
    <main class="scene-shell">
      <div class="canvas-wrapper">
        <canvas aria-label="3D QR preview"></canvas>
        <h2 class="webgpu-error" data-webgpu-error hidden>WebGPU is not available in this browser.</h2>
      </div>
      <section class="controls-overlay" aria-label="Scene controls">
        <form class="control-panel" data-url-form>
          <div class="input-row">
            <input name="url" type="url" inputmode="url" autocomplete="url" maxlength="50" aria-label="QR URL" required />
            <button class="share-button" type="submit" aria-label="Update QR">↗</button>
          </div>
        </form>
        <aside class="scene-controls" data-scene-controls aria-label="Scenes">
          <button class="scene-toggle" type="button" data-scene-toggle aria-label="Open scenes" aria-expanded="false">›</button>
          <nav class="scene-row" data-scene-row aria-label="Scene"></nav>
        </aside>
        <aside class="season-controls" data-season-controls aria-label="Seasons" hidden>
          <button class="season-toggle" type="button" data-season-toggle aria-label="Open seasons" aria-expanded="false">‹</button>
          <nav class="season-row" aria-label="Season">
            <button type="button" data-season="spring" aria-label="Spring">✿</button>
            <button type="button" data-season="summer" aria-label="Summer">☼</button>
            <button type="button" data-season="autumn" aria-label="Autumn">♧</button>
            <button type="button" data-season="winter" aria-label="Winter">❄</button>
          </nav>
        </aside>
      </section>
    </main>
  </body>
</html>
